services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app/backend
      - ./contracts:/app/contracts
      - ./data:/app/data
    environment:
      TINYFISH_API_KEY: ${TINYFISH_API_KEY:-}
      TINYFISH_BASE_URL: ${TINYFISH_BASE_URL:-https://agent.tinyfish.ai}
    command: sh -c "pip install -r backend/requirements.txt && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
  web:
    image: node:20
    working_dir: /app/web
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - backend
